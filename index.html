<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POPO">
<meta name="description" content="A daily Spanish word ladder. Change one letter at a time until you reach POPO.">
<title>POPO — Daily Spanish Word Ladder</title>
<style>
:root{
  --bg:#f6f5f1;
  --ink:#151515;
  --muted:#6f6f6f;
  --line:#8e8e8e;
  --soft:#dedbd3;
  --accent:#a96a3a;
  --accent-dark:#85502b;
  --key:#bdbbb7;
  --good:#2d7b48;
  --bad:#a63838;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
button{font:inherit}
.app{width:100%;max-width:520px;min-height:100dvh;display:flex;flex-direction:column}
header{
  height:58px;border-bottom:1px solid #d8d5cf;display:flex;align-items:center;justify-content:center;
  position:sticky;top:0;background:rgba(246,245,241,.97);z-index:4
}
.brand{font-size:30px;font-weight:900;letter-spacing:-1.5px}
.brand span{font-size:20px;margin-left:3px}
.headerBtn{position:absolute;top:12px;width:36px;height:36px;border:0;background:transparent;font-size:23px;cursor:pointer}
.headerBtn.left{left:10px}.headerBtn.right{right:10px}
main{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:14px 12px 4px}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:17px;margin-bottom:7px}
.meta{display:flex;gap:18px;justify-content:center;font-size:12px;font-weight:800;color:#555;margin-bottom:11px}
.board{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.wordrow{display:grid;grid-template-columns:repeat(4,52px);gap:5px}
.tile{
  width:52px;height:52px;border:1.5px solid var(--line);background:#fbfbfa;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;text-transform:uppercase
}
.tile.changed{background:var(--accent);border-color:var(--accent-dark);color:#111}
.tile.target{background:var(--accent);border-color:var(--accent-dark)}
.arrow{font-size:12px;color:#777;margin:1px 0}
.entry{display:grid;grid-template-columns:repeat(4,52px);gap:5px;margin-top:7px}
.entry .tile{background:#fff;border-color:#4e4e4e}
.message{height:25px;margin:8px 0 0;text-align:center;font-size:13px;font-weight:800;color:#555}
.message.good{color:var(--good)}.message.bad{color:var(--bad)}
.keyboard{width:100%;max-width:455px;margin-top:10px;padding:4px 2px 2px}
.krow{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.key{
  height:48px;flex:1;max-width:42px;min-width:29px;border:0;border-radius:3px;
  background:var(--key);font-size:15px;font-weight:900;color:#1e1e1e;cursor:pointer;box-shadow:0 1px 0 #8e8e8e
}
.key.wide{max-width:64px;font-size:11px}
.actions{display:flex;justify-content:center;gap:18px;padding:3px 10px 10px}
.actions button{border:0;background:transparent;color:#555;font-weight:900;font-size:12px;cursor:pointer}


.celebration{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99999;
}
.poop{
  position:absolute;top:-70px;display:block;
  font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  font-size:clamp(30px,9vw,48px);line-height:1;
  animation:poopFall linear forwards;will-change:transform,opacity;
}
@keyframes poopFall{
  0%{transform:translate3d(0,-80px,0) rotate(0deg);opacity:0}
  8%{opacity:1}
  100%{transform:translate3d(var(--drift),110vh,0) rotate(var(--spin));opacity:1}
}
.modalBg{
  display:none;
  position:fixed;inset:0;background:rgba(0,0,0,.44);
  z-index:1000;align-items:center;justify-content:center;padding:18px;
}
.modal{
  background:white;width:min(94vw,430px);border-radius:9px;padding:21px;
  box-shadow:0 20px 60px rgba(0,0,0,.25)
}
.modal h2{margin:0 0 12px;font-size:23px}
.modal p,.modal li{line-height:1.52;color:#343434}
.close{width:100%;border:0;background:#222;color:#fff;padding:12px;border-radius:5px;font-weight:900;cursor:pointer;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:13px 0}
.stat{border:1px solid #ddd;border-radius:5px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:20px}.stat small{font-size:10px;color:#666;font-weight:800}
.sharebox{white-space:pre-wrap;background:#f4f4f4;border:1px solid #ddd;padding:11px;border-radius:5px;font-family:monospace;font-size:13px}
.loader{display:inline-block;width:10px;height:10px;border:2px solid #bbb;border-top-color:#444;border-radius:50%;animation:spin .8s linear infinite;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    overflow-x:hidden;
  }
  .app{
    width:100%;
    max-width:520px;
    min-height:100dvh;
    overflow-x:hidden;
  }
  header{width:100%;box-sizing:border-box}
  main{
    width:100%;
    box-sizing:border-box;
    padding:10px 8px 2px;
    min-height:0;
  }
  .keyboard{
    position:fixed !important;
    left:50% !important;
    right:auto !important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 88px) !important;
    transform:translateX(-50%) !important;
    width:calc(100vw - 12px) !important;
    max-width:455px !important;
    margin:0 !important;
    padding:4px 2px 2px !important;
    z-index:9998 !important;
    box-sizing:border-box !important;
    background:rgba(246,245,241,.98) !important;
  }
  .krow{gap:4px;margin-bottom:4px}
  .key{height:44px;min-width:0}
  .actions{
    position:fixed !important;
    left:0 !important;right:0 !important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 4px) !important;
    width:100% !important;
    z-index:9999 !important;
    box-sizing:border-box !important;
    padding:4px 8px !important;
    background:rgba(246,245,241,.98) !important;
  }
}
@media(max-width:380px){
  .wordrow,.entry{grid-template-columns:repeat(4,46px)}
  .tile{width:46px;height:46px;font-size:25px}
  .key{height:40px}
}
</style>

<style id="reset-button-style">
@media(max-width:600px){
  .actions{gap:10px;padding-left:5px;padding-right:5px}
  .actions button{font-size:12px;padding:7px 8px}
}
</style>


<style id="mobile-touch-fix">
html, body { -webkit-text-size-adjust: 100%; }
button, .key, .actions, .keyboard {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;

  document.addEventListener("gesturechange", function(e){ e.preventDefault(); }, {passive:false});

document.addEventListener("DOMContentLoaded", function(){
  const bg=document.getElementById("modalBg");
  if(bg) bg.style.display="none";
});
</script>

html,body{-webkit-text-size-adjust:100%}
button,.key,.actions,.keyboard{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;

<style id="modal-mobile-v21">
@media (max-width:600px){
  body.modal-open .keyboard,
  body.modal-open .actions{
    display:none !important;
  }

  body.modal-open{
    overflow:hidden !important;
  }

  .modalBg{
    align-items:flex-start !important;
    justify-content:center !important;
    padding:16px 10px !important;
    box-sizing:border-box !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
  }

  .modal{
    width:calc(100vw - 20px) !important;
    max-width:520px !important;
    max-height:calc(100dvh - 32px) !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
    box-sizing:border-box !important;
    margin:0 auto !important;
    padding:20px !important;
  }

  .modal h2{
    font-size:28px !important;
    line-height:1.15 !important;
  }

  .modal p,.modal li{
    font-size:18px !important;
    line-height:1.45 !important;
  }
}
</style>


<style id="mobile-entry-visibility-v22">
@media (max-width:600px){
  /*
   * The custom keyboard is fixed to the bottom of the viewport.
   * Keep the four-letter entry row above it so the letters being typed
   * are never hidden underneath the keyboard.
   */
  .entry{
    position:fixed !important;
    left:50% !important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 88px + 222px) !important;
    transform:translateX(-50%) !important;
    z-index:10000 !important;
    margin:0 !important;
    padding:3px !important;
    background:var(--bg) !important;
    border-radius:4px !important;
  }

  /*
   * Leave enough room in the document so the fixed entry row does not
   * cover the bottom of the game board when the page is scrolled.
   */
  main{
    padding-bottom:250px !important;
  }
}

@media (max-width:380px){
  .entry{
    bottom:calc(env(safe-area-inset-bottom,0px) + 88px + 206px) !important;
  }
}
</style>

</head>
<body>
<div class="app">
<header>
  <button class="headerBtn left" id="helpBtn" aria-label="How to play">?</button>
  <div class="brand">POPO <span>💩</span></div>
  <button class="headerBtn right" id="statsBtn" aria-label="Stats">▥</button>
</header>

<main>
  <div class="status" id="dictStatus"><span class="loader"></span>Loading Spanish dictionary…</div>
  <div class="meta"><span id="dayLabel">DAILY</span><span>PAR <b id="par">—</b></span><span>SCORE <b id="score">0</b></span></div>

  <div class="board" id="board"></div>
  <div class="entry" id="entry"></div>
  <div class="message" id="message"></div>

  <div class="keyboard">
    <div class="krow" id="row1"></div>
    <div class="krow" id="row2"></div>
    <div class="krow" id="row3"></div>
  </div>
</main>

<div class="actions">
  <button id="undoBtn">UNDO</button>
  <button id="hintBtn">HINT</button>
  <button id="shareBtn">SHARE</button>
</div>
</div>

<div class="modalBg" id="modalBg">
  <div class="modal">
    <div id="modalContent"></div>
    
  </div>
</div>

<script>
if (window.visualViewport) {
  const setVH = () => document.documentElement.style.setProperty("--vh", `${window.visualViewport.height * 0.01}px`);
  window.visualViewport.addEventListener("resize", setVH);
  setVH();
}

const TARGET = "POPO";
const APP_VERSION = "v4-fresh-start";
const WORD_SOURCE = "https://raw.githubusercontent.com/studentenherz/spanish-wordlist/master/es_all.txt";
const DICT_CACHE_KEY = "cambia1-dictionary-v2";
const DICT_VERSION = "2026-10-v21";
const FALLBACK = [
"POPO","CADA","CALA","CAMA","CANA","CARA","CASA","CAVA","VACA","PACA","PALA","RANA","LANA","NADA",
"MALA","MAMA","MATA","MASA","PATA","PAPA","PASA","RAMA","RATA","SALA","TALA","TAPA","TASA","LATA",
"GATA","GANA","DAMA","DATO","DADO","LADO","LAGO","MANO","MAPA","MATE","META","MESA","ROSA","ROPA",
"ROCA","RISA","RUTA","SACO","SANO","SAPO","SECA","SECO","SOPA","SUMA","TACO","TAZA","TELA","TEMA",
"TIPO","TIRA","TODO","TOMA","TONO","TORO","TUBO","VASO","VELA","VENA","VIDA","VINO","VIVO","ZONA",
"BALA","BATA","BATE","BESO","BOLA","BOTA","BOTE","CABO","CEBO","CENA","CERO","CIMA","CINE","CITA",
"COLA","COMA","COPA","COSA","COTA","CUBO","DEDO","DONA","DURO","FAMA","FARO","FILA","FINO","FOTO",
"GATO","GIRO","GOMA","HADA","HILO","HORA","IDEA","JEFE","JUGO","LIMA","LISO","LOBO","LOCO","LONA",
"LUNA","MALO","MAYO","MIEL","MODO","MONO","MOTO","NATA","NAVE","NIDO","NOTA","NUBE","OJOS","ONDA",
"PALO","PANA","PATO","PENA","PESO","PICA","PICO","PIEL","PILA","PINO","PISO","POCO","PUMA","RAMO",
"RATO","RAYA","REMO","RETO","RICO","RITO","ROJO","SALE","SEDA","SEIS","TINA","YATE"
];

let WORDS = new Set(FALLBACK);
let patternMap = new Map();
let distances = new Map();
let input = "";
let path = [];
let won = false;
let puzzle = null;
let dictionaryReady = false;
let hintsUsed = 0;

const $ = id => document.getElementById(id);

function normalizeWord(s){
  return String(s||"").trim().toUpperCase()
    .replaceAll("Á","A").replaceAll("É","E").replaceAll("Í","I")
    .replaceAll("Ó","O").replaceAll("Ú","U").replaceAll("Ü","U");
}
function validFour(s){
  return /^[A-ZÑ]{4}$/.test(s);
}
function dayKey(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dayNumber(){
  const d=new Date(), base=new Date(2026,0,1);
  return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-base)/86400000);
}
function hashString(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}
function differsByOne(a,b){
  let n=0;
  for(let i=0;i<4;i++){ if(a[i]!==b[i] && ++n>1) return false; }
  return n===1;
}
function patterns(w){
  return [0,1,2,3].map(i=>w.slice(0,i)+"*"+w.slice(i+1));
}
function buildPatternMap(){
  patternMap = new Map();
  for(const w of WORDS){
    for(const p of patterns(w)){
      if(!patternMap.has(p)) patternMap.set(p,[]);
      patternMap.get(p).push(w);
    }
  }
}
function neighbors(w){
  const s=new Set();
  for(const p of patterns(w)){
    const arr=patternMap.get(p)||[];
    for(const x of arr) if(x!==w) s.add(x);
  }
  return [...s];
}
function computeDistancesFromTarget(){
  distances = new Map([[TARGET,0]]);
  const q=[TARGET];
  for(let qi=0;qi<q.length;qi++){
    const w=q[qi], d=distances.get(w);
    for(const n of neighbors(w)){
      if(!distances.has(n)){distances.set(n,d+1);q.push(n)}
    }
  }
}
function shortestPath(start,target=TARGET){
  if(start===target) return [start];
  const seen=new Set([start]), q=[start], parent=new Map();
  for(let qi=0;qi<q.length;qi++){
    const w=q[qi];
    for(const n of neighbors(w)){
      if(seen.has(n)) continue;
      seen.add(n); parent.set(n,w);
      if(n===target){
        const out=[target]; let cur=target;
        while(cur!==start){cur=parent.get(cur);out.push(cur)}
        return out.reverse();
      }
      q.push(n);
    }
  }
  return null;
}
function chooseDailyPuzzle(){
  const candidates=[...distances.entries()]
    .filter(([w,d])=>d>=3 && d<=6 && /^[A-ZÑ]{4}$/.test(w))
    .map(([w,d])=>({w,d}));
  const seed=hashString(dayKey());
  const pick=candidates.length?candidates[seed%candidates.length]:{w:"CANA",d:2};
  return {start:pick.w,par:pick.d};
}
function save(){
  if(!puzzle) return;
  localStorage.setItem("cambale-popo-v7-game-"+dayKey(), JSON.stringify({start:puzzle.start,path,won,par:puzzle.par}));
}
function loadGame(){
  const k="cambale-popo-v7-game-"+dayKey();
  const saved=JSON.parse(localStorage.getItem(k)||"null");
  if(saved && saved.start===puzzle.start && Array.isArray(saved.path)){
    path=saved.path; won=!!saved.won; hintsUsed=Number(saved.hints||0);
  } else {
    path=[puzzle.start]; won=false; save();
  }
}
function streak(){
  return Number(localStorage.getItem("cambia1-streak")||0);
}
function updateWinStats(){
  const today=dayKey(), last=localStorage.getItem("cambia1-last-win");
  const y=new Date(); y.setDate(y.getDate()-1);
  if(last!==today){
    localStorage.setItem("cambia1-streak", last===dayKey(y)?String(streak()+1):"1");
    localStorage.setItem("cambia1-last-win",today);
    localStorage.setItem("cambia1-games",String(Number(localStorage.getItem("cambia1-games")||0)+1));
    localStorage.setItem("cambia1-total-moves",String(Number(localStorage.getItem("cambia1-total-moves")||0)+Math.max(0,path.length-1)));
    if(path.length-1===puzzle.par) localStorage.setItem("cambia1-pars",String(Number(localStorage.getItem("cambia1-pars")||0)+1));
  }
}
function row(word,prev,isTarget=false){
  const r=document.createElement("div"); r.className="wordrow";
  [...word].forEach((ch,i)=>{
    const t=document.createElement("div"); t.className="tile";
    // Feedback is based ONLY on POPO: highlight a tile when the
    // letter exactly matches the target letter in the same position.
    if(ch===TARGET[i]) t.classList.add(isTarget?"target":"changed");
    t.textContent=ch; r.appendChild(t);
  });
  return r;
}
function render(){
  if(!puzzle) return;
  const b=$("board"); b.innerHTML="";
  path.forEach((w,i)=>b.appendChild(row(w,i?path[i-1]:null,false)));
  if(!won){
    const arrow=document.createElement("div"); arrow.className="arrow"; arrow.textContent="↓";
    b.appendChild(arrow);
    b.appendChild(row(TARGET,null,true));
  }
  $("par").textContent=puzzle.par;
  $("score").textContent=Math.max(0,path.length-1)+hintsUsed;
  renderEntry();
}
function renderEntry(){
  const e=$("entry"); e.innerHTML="";
  for(let i=0;i<4;i++){
    const t=document.createElement("div"); t.className="tile"; t.textContent=input[i]||""; e.appendChild(t);
  }
}
function msg(text,kind=""){
  const m=$("message");m.textContent=text;m.className="message "+kind;
}

function celebrate(){
  const old=document.querySelector(".celebration");
  if(old) old.remove();
  const layer=document.createElement("div");
  layer.className="celebration";
  document.body.appendChild(layer);
  for(let i=0;i<80;i++){
    const s=document.createElement("span");
    s.className="poop";
    s.textContent="💩";
    s.style.left=(Math.random()*100)+"%";
    s.style.animationDuration=(2.0+Math.random()*2.5)+"s";
    s.style.animationDelay=(Math.random()*0.35)+"s";
    s.style.setProperty("--drift",(Math.random()*240-120)+"px");
    s.style.setProperty("--spin",(Math.random()*1200-600)+"deg");
    layer.appendChild(s);
  }
  setTimeout(()=>layer.remove(),5200);
}

function submit(){
  if(won || !dictionaryReady) return;
  const g=normalizeWord(input); input=""; renderEntry();
  if(g.length!==4) return msg("Enter a 4-letter word.","bad");
  if(!WORDS.has(g)) return msg("That word is not in the Spanish dictionary.","bad");
  const cur=path[path.length-1];
  if(!differsByOne(cur,g)) return msg(`Change exactly one letter from ${cur}.`,"bad");
  if(path.includes(g)) return msg("You already used that word.","bad");
  path.push(g);
  if(g===TARGET){
    won=true; updateWinStats(); save(); render();
    const finalScore=Math.max(0,path.length-1)+hintsUsed;
    const over=finalScore-puzzle.par;
    msg(over===0?`Solved at PAR: ${puzzle.par}! 🎉`:`Final score: ${finalScore}. PAR was ${puzzle.par}.`,"good");
    setTimeout(celebrate, 50);
  } else {
    save(); render(); msg("");
  }
}
function keyPress(k){
  if(!dictionaryReady || won) return;
  if(k==="ENTER") return submit();
  if(k==="⌫"){input=input.slice(0,-1);renderEntry();return}
  if(input.length<4){input+=k;renderEntry()}
}
function makeKeys(id,keys){
  const el=$(id);
  for(const k of keys){
    const b=document.createElement("button");b.className="key"+((k==="ENTER"||k==="⌫")?" wide":"");
    b.textContent=k;b.onclick=()=>keyPress(k);el.appendChild(b);
  }
}
function modal(html){$("modalContent").innerHTML=html;$("modalBg").style.display="flex"}
function changedIndex(a,b){
  for(let i=0;i<4;i++) if(a[i]!==b[i]) return i;
  return -1;
}
function shareGrid(){
  const rows=[];
  for(const word of path){
    const r=[...word].map((ch,i)=>ch===TARGET[i]?"🟫":"⬜");
    rows.push(r.join(""));
  }
  return rows.join("\n");
}
async function shareResult(){
  const finalScore=Math.max(0,path.length-1)+hintsUsed;
 const result=`POPO #${Math.max(1,dayNumber()+1)} ${won?"✅":"🟨"}\nScore: ${finalScore} | PAR: ${puzzle.par}\n${shareGrid()}\n💩 POPO`;
  if(navigator.share){try{await navigator.share({title:"POPO",text:result,url:location.href});return}catch(e){}}
  try{await navigator.clipboard.writeText(result);msg("Result copied!","good")}
  catch(e){modal(`<h2>Share result</h2><div class="sharebox">${result.replace(/\n/g,"<br>")}</div>`)}
}



function hint(){
  if(won) return msg("You already solved today's puzzle.","good");
  const cur=path[path.length-1];
  const route=shortestPath(cur,TARGET);
  if(route && route.length>1){
    hintsUsed += 1;
    save();
    render();
    msg(`Hint: try ${route[1]}. +1 penalty`,"good");
  } else msg("No hint available from this word.","bad");
}
function undo(){
  if(won) return msg("Today's puzzle is already complete.","bad");
  if(path.length>1){path.pop();save();render();msg("")}
}
async function loadDictionary(){
  $("dictStatus").innerHTML='<span class="loader"></span>Loading Spanish dictionary…';

  let loaded = null;

  // Use a valid locally cached dictionary immediately.
  try{
    const cached = JSON.parse(localStorage.getItem(DICT_CACHE_KEY) || "null");
    if(cached && Array.isArray(cached.words) && cached.words.length > 1000){
      loaded = cached.words;
    }
  }catch(e){}

  // Fetch the full dictionary only when a usable cache isn't available.
  if(!loaded){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(), 5000);
      const res = await fetch(WORD_SOURCE, {cache:"no-store", signal:controller.signal});
      clearTimeout(timeout);
      if(!res.ok) throw new Error("dictionary fetch failed");

      const text = await res.text();
      const set = new Set();

      for(const raw of text.split(/\r?\n/)){
        const w = normalizeWord(raw);
        if(validFour(w)) set.add(w);
      }

      set.add(TARGET);
      loaded = [...set];

      try{
        localStorage.setItem(
          DICT_CACHE_KEY,
          JSON.stringify({version:DICT_VERSION, words:loaded})
        );
      }catch(e){}
    }catch(e){
      loaded = [...new Set(FALLBACK)];
      $("dictStatus").textContent =
        `${loaded.length.toLocaleString()} offline Spanish words loaded`;
    }
  }

  WORDS = new Set(loaded);
  WORDS.add(TARGET);

  buildPatternMap();
  computeDistancesFromTarget();
  puzzle = chooseDailyPuzzle();
  loadGame();
  dictionaryReady = true;

  $("dictStatus").textContent =
    `${WORDS.size.toLocaleString()} valid 4-letter Spanish words loaded`;

  render();
}

<script id="top-buttons-v20">
(function(){
  function openModal(id){
    var el=document.getElementById(id);
    if(!el) return false;
    el.style.display="flex";
    el.setAttribute("aria-hidden","false");
    document.body.classList.add("modal-open");
    return true;
  }

  function closeModal(id){
    var el=document.getElementById(id);
    if(!el) return;
    el.style.display="none";
    el.setAttribute("aria-hidden","true");
    if(!document.querySelector(".modalBg[style*='display: flex'], .modalBg[style*='display:flex']")){
      document.body.classList.remove("modal-open");
    }
  }

  document.addEventListener("click", function(e){
    var t=e.target.closest("button, [role='button']");
    if(!t) return;

    var id=(t.id||"").toLowerCase();
    var text=(t.textContent||"").trim();

    // Help / question mark.
    if(id==="helpbtn" || id==="help" || text==="?" || t.getAttribute("aria-label")==="Help"){
      if(openModal("helpModal") || openModal("modalBg")) return;
    }

    // Stats / chart icon.
    if(id==="statsbtn" || id==="stats" || t.getAttribute("aria-label")==="Statistics"){
      if(openModal("statsModal") || openModal("statsBg")) return;
    }
  });

  // Clicking the shaded area closes either modal.
  document.addEventListener("click", function(e){
    ["helpModal","statsModal","modalBg","statsBg"].forEach(function(id){
      var el=document.getElementById(id);
      if(el && e.target===el) closeModal(id);
    });
  });
})();
</script>
